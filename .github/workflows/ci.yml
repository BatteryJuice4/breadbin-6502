name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libpulse-dev libdbus-1-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # A crash in CI only (e.g. a different compiler) is hard to reproduce: rerun
      # each failed test under gdb and print where it stopped.
      - name: Backtrace failed tests
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb >/dev/null
          grep -o -m1 -w 'user_shstk' /proc/cpuinfo || echo "no user_shstk"
          for name in $(cut -d: -f2 build/Testing/Temporary/LastTestsFailed.log); do
            echo "::group::gdb test_$name"
            (cd build && gdb -q -batch -ex run -ex bt -ex 'p $_siginfo.si_code' \
              -ex 'p $_siginfo._sifields._sigfault.si_addr' -ex 'info registers' \
              -ex 'x/12i $pc-24' ./test_$name) || true
            echo "::endgroup::"
            echo "::group::test_$name with shadow stack off"
            (cd build && GLIBC_TUNABLES=glibc.cpu.x86_shstk=off ./test_$name; echo "exit $?") || true
            echo "::endgroup::"
            mkdir -p failed-tests && cp build/test_$name failed-tests/
          done

      - name: Upload failed test binaries
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-linux
          path: failed-tests/
          if-no-files-found: ignore

  # FreeBSD in a VM (verified by hand on 15.1 too: build, all tests, evdev backend).
  freebsd:
    name: freebsd-15.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y cmake-core ninja pkgconf libX11 libXi libXcursor libglvnd pulseaudio
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            ctest --test-dir build --output-on-failure

  # Release packages: on version tags (and by hand). Linux builds on the oldest
  # supported Ubuntu so the AppImage runs on older distributions too.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libpulse-dev libdbus-1-dev
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release -DBB_BUILD_TESTS=OFF \
            -DBB_SOURCE_URL="${{ github.server_url }}/${{ github.repository }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          (cd build && cpack -C Release)
          if [ "$RUNNER_OS" = "Linux" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$PWD/appimagetool" \
              packaging/linux/make-appimage.sh build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.AppImage
